[package]
name = "pax-axum-audio-experiment"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = "=0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
libc = "0.2"
subtle = "2.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
flate2 = { version = "1", default-features = false, features = ["zlib"] }
futures-util = "0.3"
hyper = "1"

[build-dependencies]
cc = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
