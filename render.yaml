services:
  - type: web
    name: audio-analysis-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: AUDIO_ANALYSIS_BASIC_AUTH_USERNAME
        value: analysis
      - key: AUDIO_ANALYSIS_BASIC_AUTH_PASSWORD
        sync: false
      - key: AUDIO_ANALYSIS_VERSION
        value: essentia-sidecar-v1
